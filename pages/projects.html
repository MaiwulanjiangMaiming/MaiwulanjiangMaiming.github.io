<script src="https://cdn.jsdelivr.net/gh/MaiwulanjiangMaiming/GRI-contribution-graph@output/gri-core.js"></script>
<script>
(function(){
  var griRenderer = null;

  function getTheme() {
    var theme = document.documentElement.getAttribute('data-theme');
    if (theme === 'light') return 'light';
    if (theme === 'dark') return 'dark';
    return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }

  function initGRI() {
    var container = document.getElementById('gri-container');
    if (!container || typeof GRI === 'undefined') {
      console.log('GRI not loaded yet, retrying...');
      setTimeout(initGRI, 500);
      return;
    }

    container.innerHTML = '';

    GRI.init({
      container: '#gri-container',
      username: 'MaiwulanjiangMaiming',
      theme: getTheme(),
      showKSpace: true,
      showEcho: true,
      showHUD: true,
      autoPlay: true,
    }).then(function(renderer) {
      griRenderer = renderer;
    }).catch(function(err) {
      console.error('GRI init failed:', err);
      container.innerHTML = '<p style="text-align:center;color:var(--muted)">Failed to load GRI scanner. Please refresh.</p>';
    });
  }

  // Listen for theme changes
  function onThemeChange() {
    if (griRenderer && griRenderer.setTheme) {
      griRenderer.setTheme(getTheme());
    } else {
      initGRI();
    }
  }

  document.documentElement.addEventListener('themechange', onThemeChange);

  var observer = new MutationObserver(function(mutations) {
    mutations.forEach(function(m) {
      if (m.attributeName === 'data-theme') onThemeChange();
    });
  });
  observer.observe(document.documentElement, { attributes: true });

  // Init when DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initGRI);
  } else {
    initGRI();
  }

  renderGitHubRepos('MaiwulanjiangMaiming');
})();
</script>
