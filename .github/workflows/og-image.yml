name: Generate OG Image

on:
  push:
    branches: [main]
    paths: ['scripts/gen-og.js']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install canvas
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential libcairo2-dev libjpeg-dev libpango1.0-dev libgif-dev librsvg2-dev
          npm init -y && npm install canvas

      - name: Generate OG image
        run: node scripts/gen-og.js

      - name: Commit OG image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/og-image.png
          git diff --cached --quiet || git commit -m "chore: regenerate OG image"
          git push
