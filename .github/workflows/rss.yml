name: Generate RSS Feed

on:
  push:
    branches: [main]
    paths: ['content/papers.json', 'scripts/gen-rss.js']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate RSS feed
        run: node scripts/gen-rss.js

      - name: Commit feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git diff --cached --quiet || git commit -m "chore: regenerate RSS feed"
          git push
