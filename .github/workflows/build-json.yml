name: Build JSON from Markdown

on:
  push:
    branches: [main]
    paths: ['data/**/*.md', 'scripts/build-json.js']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build JSON
        run: node scripts/build-json.js

      - name: Commit JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/papers.json data/research.json data/projects.json
          git diff --cached --quiet || git commit -m "chore: rebuild JSON from markdown"
          git push
